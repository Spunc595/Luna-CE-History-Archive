[package]
name = "luna_chess"
version = "14.4.0"
edition = "2021"
authors = ["Daniele", "Gemini"]

[dependencies]
# Per la generazione dei numeri casuali dell'Hash Zobrist
rand = "0.8"
rand_chacha = "0.3"
# Per gestire le tabelle precalcolate in modo efficiente
lazy_static = "1.4"

[profile.release]
opt-level = 3
lto = true
panic = "abort"